#Goal: Just a dummy CICD Pipeline.
name: CICD-Demo
on:
  push:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: "Clone The code"
        uses: actions/checkout@v4
        
  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: "Build The code with docker"
        run: echo "code is getting build"    
  Test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Code is getting tested"
        run: echo "code is getting tested"
  Deploy:
    needs: [code,build,Test]
    runs-on: ubuntu-latest
    steps:
      - name: "Deploy The code"
        run: echo "code is getting Deployed"
