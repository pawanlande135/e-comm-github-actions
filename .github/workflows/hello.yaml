# Gaol is to say Hellow & Tell the tittle !

# start naming the workflow
name: "Hello Workflow"
# on tells when the workflow runs.
on: 
   workflow_dispatch:
jobs: 
  greet: 
    runs-on: ubuntu-latest
    steps: 
      - name: "Say Hello"
        run: echo "Hello"
  repo-name:
    needs: greet
    runs-on: ubuntu-latest
    steps:
       - name: Display Repository Name
         run: echo "The repository name is ${{ github.event.repository.name }}"
      
        
        
