name: Show ENV Variables

on: 
   workflow_dispatch:
    inputs:
      environment:
        description: Select the environment you want
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage
          - prod
      

env:
   NAME: Pawan

jobs:
   show_env:
     runs-on: ubuntu-latest
     steps:
        - name: Show env in plan text
          run: echo "My name is ${{ env.NAME }}"
        - name: Invoke Secrets
          run: echo "Invoked secret is ${{ secrets.JOHN_SECRET }}"
        - name: show the declared variable
          run: echo "Declared variable is ${{ vars.DOCKERHUB_USERNAME }}"
